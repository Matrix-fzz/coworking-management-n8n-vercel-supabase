<!DOCTYPE html>
<html lang="fr" class="bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil - Coworking Manager</title>
    <link rel="stylesheet" href="../css/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="text-slate-800 font-sans antialiased">
    
    <nav class="fixed w-full z-50 transition-all duration-300 bg-white/80 backdrop-blur-md border-b border-gray-100 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">
          <a href="../index.html" class="flex items-center gap-3 decoration-0 group">
            <div class="w-10 h-10 bg-primary-600 rounded-xl flex items-center justify-center text-white text-lg shadow-lg shadow-primary-500/30 group-hover:scale-105 transition-transform duration-300">
              <i class="fas fa-building"></i>
            </div>
            <span class="text-xl font-bold bg-gradient-to-r from-slate-800 to-slate-600 bg-clip-text text-transparent">Coworking Manager</span>
          </a>

          <button class="md:hidden w-10 h-10 flex items-center justify-center rounded-lg hover:bg-gray-100 text-slate-600 focus:outline-none" id="menuToggle">
            <i class="fas fa-bars text-xl"></i>
          </button>

          <div class="hidden md:flex items-center gap-8" id="navLinksDesktop">
            <a href="../index.html" class="text-slate-600 font-medium hover:text-primary-600 transition-colors duration-200">
              <i class="fas fa-home mr-2"></i>Accueil
            </a>
            <a href="favorites.html" class="text-slate-600 font-medium hover:text-primary-600 transition-colors duration-200">
              <i class="fas fa-heart mr-2"></i>Mes Favoris
            </a>
            <a href="scraping.html" class="text-slate-600 font-medium hover:text-primary-600 transition-colors duration-200">
              <i class="fas fa-robot mr-2"></i>Scraping
            </a>
            
            <div class="user-section flex items-center gap-4" id="userSection">
               <a href="profile.html" class="flex items-center gap-3 py-2 px-3 rounded-lg bg-primary-50 text-primary-600" title="Gérer mon profil">
                <div class="w-8 h-8 rounded-full bg-primary-100 flex items-center justify-center text-primary-600">
                   <i class="fas fa-user text-sm"></i>
                </div>
                <span id="usernameDisplay" class="font-medium">User</span>
              </a>
              <button onclick="logout()" class="w-9 h-9 flex items-center justify-center rounded-lg bg-red-50 text-red-500 hover:bg-red-100 transition-colors" title="Déconnexion">
                <i class="fas fa-sign-out-alt"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
      <!-- Mobile Menu -->
       <div class="md:hidden hidden bg-white border-t border-gray-100 absolute w-full left-0 shadow-lg" id="navLinks">
        <div class="px-4 py-6 space-y-4 flex flex-col">
          <a href="../index.html" class="flex items-center gap-3 text-slate-600 font-medium p-2 rounded-lg hover:bg-gray-50">
            <i class="fas fa-home w-5"></i>Accueil
          </a>
          <a href="favorites.html" class="flex items-center gap-3 text-slate-600 font-medium p-2 rounded-lg hover:bg-gray-50">
            <i class="fas fa-heart w-5"></i>Mes Favoris
          </a>
           <a href="scraping.html" class="flex items-center gap-3 text-slate-600 font-medium p-2 rounded-lg hover:bg-gray-50">
            <i class="fas fa-robot w-5"></i>Scraping
          </a>
        </div>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-28 pb-20">
        <div class="max-w-4xl mx-auto">
            <div class="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden">
                <div class="h-32 bg-gradient-to-r from-primary-600 to-violet-600"></div>
                <div class="px-8 pb-8">
                    <div class="relative flex justify-between items-end -mt-12 mb-8">
                        <div class="flex items-end gap-6">
                            <div class="w-24 h-24 rounded-2xl bg-white p-1 shadow-lg">
                                <div class="w-full h-full rounded-xl bg-slate-100 flex items-center justify-center text-4xl text-slate-400">
                                    <i class="fas fa-user"></i>
                                </div>
                            </div>
                            <div class="mb-1">
                                <h1 class="text-2xl font-bold text-slate-900">Mon Profil</h1>
                                <p class="text-slate-500">Gérez vos informations personnelles</p>
                            </div>
                        </div>
                    </div>

                    <form id="profileForm" class="space-y-8">
                        <div>
                            <h3 class="text-lg font-bold text-slate-800 border-b border-gray-100 pb-2 mb-4">Informations de base</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Nom d'utilisateur</label>
                                    <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                           <i class="fas fa-user-tag"></i>
                                        </div>
                                        <input type="text" id="username" name="username" required class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition-all">
                                    </div>
                                </div>
                                <div>
                                    <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                                     <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                           <i class="fas fa-envelope"></i>
                                        </div>
                                        <input type="email" id="email" name="email" required class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition-all">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div>
                            <h3 class="text-lg font-bold text-slate-800 border-b border-gray-100 pb-2 mb-4">Sécurité</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Nouveau mot de passe</label>
                                     <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                           <i class="fas fa-lock"></i>
                                        </div>
                                        <input type="password" id="password" name="password" minlength="6" placeholder="Laisser vide pour ne pas changer" class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition-all placeholder:text-slate-300">
                                    </div>
                                </div>
                                <div>
                                    <label for="confirmPassword" class="block text-sm font-medium text-slate-700 mb-1">Confirmer mot de passe</label>
                                    <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                           <i class="fas fa-lock"></i>
                                        </div>
                                        <input type="password" id="confirmPassword" name="confirmPassword" minlength="6" placeholder="Confirmer" class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition-all placeholder:text-slate-300">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="flex justify-end pt-4">
                            <button type="submit" class="px-6 py-3 bg-primary-600 text-white rounded-xl font-semibold shadow-lg shadow-primary-500/30 hover:bg-primary-700 hover:-translate-y-0.5 transition-all duration-300">
                                <i class="fas fa-save mr-2"></i> Enregistrer les modifications
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 pt-16 pb-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-slate-400 text-sm">
            &copy; 2025 Coworking Manager. Tous droits réservés.
        </div>
    </footer>

    <script src="../js/notifications.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
             const menuToggle = document.getElementById('menuToggle');
            const navLinks = document.getElementById('navLinks');
            
            if(menuToggle && navLinks) {
                menuToggle.addEventListener('click', () => {
                    navLinks.classList.toggle('hidden');
                });
            }

            if (!AuthManager.requireAuth()) return;
            AuthManager.checkAuth();

            // Charger les données du profil
            try {
                const response = await CoworkingApi.getProfile();
                if (response.success && response.data.user) {
                    const user = response.data.user;
                    document.getElementById('username').value = user.username;
                    document.getElementById('email').value = user.email;
                    if(document.getElementById('usernameDisplay')) {
                        document.getElementById('usernameDisplay').textContent = user.username;
                    }
                }
            } catch (error) {
                console.error('Error loading profile:', error);
                // AuthManager.showMessage('Erreur lors du chargement du profil', 'error');
                AppNotification.error('Erreur lors du chargement du profil');
            }

            // Gérer la soumission du formulaire
            document.getElementById('profileForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const submitBtn = this.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                
                // Récupérer les données
                const username = document.getElementById('username').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                // Validation
                if (password && password !== confirmPassword) {
                    AppNotification.warning('Les mots de passe ne correspondent pas');
                    return;
                }

                const updateData = { username, email };
                if (password) {
                    updateData.password = password;
                }

                try {
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enregistrement...';
                    
                    const response = await AuthManager.updateProfile(updateData);
                    
                    AppNotification.success('Profil mis à jour avec succès');
                    
                    // Clear password fields
                    document.getElementById('password').value = '';
                    document.getElementById('confirmPassword').value = '';

                    // Update local form values if username/email changed
                    if (updateData.username) {
                        document.getElementById('username').value = updateData.username;
                         if(document.getElementById('usernameDisplay')) {
                            document.getElementById('usernameDisplay').textContent = updateData.username;
                        }
                    }
                    if (updateData.email) document.getElementById('email').value = updateData.email;
                } catch (error) {
                    console.error('Update error:', error);
                    let msg = error.message || 'Erreur lors de la mise à jour';
                    // if (msg.includes('email')) msg = 'Cet email est déjà utilisé';
                    AppNotification.error(msg);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                }
            });
        });
    </script>
</body>
</html>
